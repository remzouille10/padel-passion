<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1748e8">
<meta name="description" content="Padel V2 — carnet personnel de progression au padel.">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="stylesheet" href="./style.css">
<title>Padel V2</title>
</head>
<body>
<div id="app" class="app-shell">
<header class="topbar">
  <div class="brand"><img src="./assets/logo-officiel.jpg" alt="Logo Padel V2"><div><strong>PADEL V2</strong><small>Mon carnet de progression</small></div></div>
  <button class="icon-btn" id="quickSettings" aria-label="Réglages">⚙</button>
</header>
<main id="view" class="view" aria-live="polite"></main>
<nav class="bottom-nav" aria-label="Navigation principale">
  <button data-tab="home" class="nav-item active"><span>⌂</span>Accueil</button>
  <button data-tab="matches" class="nav-item"><span>▤</span>Matchs</button>
  <button id="newMatch" class="nav-add" aria-label="Créer un match">＋</button>
  <button data-tab="players" class="nav-item"><span>♙</span>Joueurs</button>
  <button data-tab="settings" class="nav-item"><span>⚙</span>Réglages</button>
</nav>
</div>
<div id="toast" class="toast" role="status"></div>
<script src="./app.js" defer></script>
</body></html>
